services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketing4startups
      POSTGRES_USER: m4s_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m4s_app -d marketing4startups"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Host binding defaults to loopback; the app still uses the private Docker network.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://m4s_app:${POSTGRES_PASSWORD}@db:5432/marketing4startups
      M4S_HOST: 0.0.0.0
      M4S_PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app_private_data:/app/data

  pgadmin:
    image: dpage/pgadmin4:9.18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_DISABLE_POSTFIX: "true"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  app_private_data:
  pgadmin_data:

